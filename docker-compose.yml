version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ${DOCKER_DATA_PATH:-./data}:/app/data
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - DB_PATH=${DOCKER_DB_PATH:-/app/data/cpg.db}
      - API_VERSION=${API_VERSION:-v1}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
        - VITE_API_BASE=/api
        - VITE_APP_TITLE=${VITE_APP_TITLE:-CPG Explorer}
        - VITE_API_VERSION=${API_VERSION:-v1}
    volumes:
      - frontend_dist:/app/dist
    restart: "no"
    networks:
      - internal

  nginx:
    build: ./nginx
    ports:
      - "${DOCKER_FRONTEND_PORT:-8000}:8000"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  frontend_dist:

networks:
  internal:
    driver: bridge
